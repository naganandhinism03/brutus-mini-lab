listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=NO

local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES

connect_from_port_20=YES
pam_service_name=vsftpd

# Security hardening
chroot_local_user=YES
allow_writeable_chroot=NO
seccomp_sandbox=NO

# Rate limiting (prevents brute-force)
max_clients=5
max_per_ip=2
